<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="src/input.css" />
    <link rel="stylesheet" href="dist/output.css" />
  </head>

  <body class="bg-[#0B1020] m-0 h-full overflow-hidden">
    <div
      class="panel max-w-7xl mx-auto flex flex-col lg:flex-row lg:h-screen lg:overflow-hidden"
    >
      <!-- Left panel -->
      <div
        class="left m-3 p-3 bg-[#191E2D] rounded-lg lg:w-1/4 overflow-y-auto"
      >
        <h1 class="taskflow text-white text-3xl font-semibold">TaskFlow</h1>
        <h2 class="productivity text-white font-semibold mt-2">
          Productivity OS
        </h2>

        <button class="toggle text-black bg-white text-xs p-1 w-full mt-3">
          🌙 Toggle Theme
        </button>

        <h2 class="dates text-white font-semibold mt-3"></h2>

        <!-- Filters for selecting -->
        <div class="mt-4 space-y-2">
          <button
            class="filterBtn w-full bg-white text-xs font-semibold text-black p-1"
            data-filter="all"
          >
            All
          </button>
          <button
            class="filterBtn mt-2 w-full text-xs font-semibold bg-white text-black p-1"
            data-filter="active"
          >
            Active
          </button>
          <button
            class="filterBtn w-full mt-2 text-xs font-semibold bg-white text-black p-1"
            data-filter="completed"
          >
            Completed
          </button>
          <button
            class="filterBtn w-full mt-2 text-xs font-semibold bg-white text-black p-1"
            data-filter="pinned"
          >
            Pinned
          </button>

          <button
            class="filterBtn w-full mt-2 text-xs font-semibold bg-white text-black p-1"
            data-filter="archived"
          >
            Archive
          </button>
        </div>

        <!-- Counting -->
        <div class="view text-white mt-7 font-semibold space-y-2">
          <div>Total: <span id="totalCount">0</span></div>
          <div class="mt-4">Done: <span id="doneCount">0</span></div>
          <div class="mt-4">Pending: <span id="pendingCount">0</span></div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="right p-3 lg:w-3/4 flex flex-col min-h-0">
        <!-- Search -->
        <div class="search flex gap-2">
          <input
            class="search bg-[#272B39] w-full p-2 text-white rounded-lg text-sm"
            placeholder="Search..."
          />
        </div>

        <!-- Task inputs -->
        <div
          class="input mt-3 bg-[#191E2D] p-3 rounded-lg text-white space-y-2"
        >
          <input
            class="title w-full text-sm rounded-lg p-2 bg-[#272B39]"
            placeholder="Task Title"
          />
          <input
            class="description rounded-lg text-sm w-full mt-2 p-2 bg-[#272B39]"
            placeholder="Description"
          />
          <input
            type="date"
            class="date rounded-lg text-sm w-full mt-2 p-2 pr-4 bg-[#272B39]"
          />
          <input
            class="tags w-full mt-2 rounded-lg text-sm p-2 bg-[#272B39]"
            placeholder="Tags"
          />
          <input
            class="subtask w-full rounded-lg mt-2 text-sm p-2 bg-[#272B39]"
            placeholder="Subtasks"
          />

          <button
            class="task bg-white mt-2 text-sm font-semibold text-black w-full"
          >
            + Add Task
          </button>
        </div>

        <!-- Tasks -->
        <div
          id="taskContainer"
          class="flex flex-col gap-3 overflow-y-auto rounded-lg"
        ></div>
      </div>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
